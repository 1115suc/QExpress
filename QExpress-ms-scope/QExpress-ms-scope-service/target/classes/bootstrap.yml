application:
  version: v1.0
logging:
  config: classpath:logback-spring.xml
spring:
  application:
    name: QExpress-ms-scope
  profiles:
    active: local
  mvc:
    pathmatch:
      #解决异常：swagger Failed to start bean 'documentationPluginsBootstrapper'; nested exception is java.lang.NullPointerException
      #因为Springfox使用的路径匹配是基于AntPathMatcher的，而Spring Boot 2.6.X使用的是PathPatternMatcher
      matching-strategy: ant_path_matcher
qe:
  swagger:
    package-path: course.QExpress.scope.controller
    title: 青品速递 - 服务范围微服务接口文档
    description: 该微服务完成网点、快递员的服务范围相关业务功能。
    contact-name: QExpress-scope-service
    contact-url: http://www.1115suc.com/
    contact-email: 1115suc@gmail.com
    version: ${application.version}
application:
  version: v1.0
logging:
  config: classpath:logback-spring.xml
spring:
  application:
    name: QExpress-transport-info
  profiles:
    active: local
  mvc:
    pathmatch:
      #解决异常：swagger Failed to start bean 'documentationPluginsBootstrapper'; nested exception is java.lang.NullPointerException
      #因为Springfox使用的路径匹配是基于AntPathMatcher的，而Spring Boot 2.6.X使用的是PathPatternMatcher
      matching-strategy: ant_path_matcher
qe:
  swagger:
    package-path: course.QExpress.transport.info.controller
    title: 青品速递 - 运输信息微服务接口文档
    description: 该微服务完成运单的流转信息的记录以及查询。
    contact-name: QExpress-transport-info-service
    contact-url: http://www.1115suc.com/
    contact-email: 1115suc@gmail.com
    version: ${application.version}
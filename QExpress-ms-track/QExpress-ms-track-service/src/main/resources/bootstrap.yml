application:
  version: v1.0
logging:
  config: classpath:logback-spring.xml
spring:
  main:
    allow-circular-references: true #允许bean循环依赖
  application:
    name: QExpress-track
  profiles:
    active: test
  mvc:
    pathmatch:
      #解决异常：swagger Failed to start bean 'documentationPluginsBootstrapper'; nested exception is java.lang.NullPointerException
      #因为Springfox使用的路径匹配是基于AntPathMatcher的，而Spring Boot 2.6.X使用的是PathPatternMatcher
      matching-strategy: ant_path_matcher
qe:
  swagger:
    package-path: course.QExpress.track.controller
    title: 青品速递 - 车辆轨迹微服务接口文档
    description: 提供查询车辆轨迹、上报坐标位置等相关服务。
    contact-name: QExpress-track-service
    contact-url: http://www.1115suc.com/
    contact-email: 1115suc@gmail.com
    version: ${application.version}
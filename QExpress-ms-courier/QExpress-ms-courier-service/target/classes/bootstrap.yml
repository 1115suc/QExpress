application:
  version: v1.0
logging:
  config: classpath:logback-spring.xml
spring:
  application:
    name: QExpress-courier
  profiles:
    active: test
  mvc:
    pathmatch:
      #解决异常：swagger Failed to start bean 'documentationPluginsBootstrapper'; nested exception is java.lang.NullPointerException
      #因为Springfox使用的路径匹配是基于AntPathMatcher的，而Spring Boot 2.6.X使用的是PathPatternMatcher
      matching-strategy: ant_path_matcher
qe:
  swagger:
    package-path: course.QExpress.courier.controller
    title: 青品速递 - 快递员微服务接口文档
    description: 该微服务完成快递员相关的业务。
    contact-name: QExpress-courier-service
    contact-url: http://www.1115suc.com/
    contact-email: 1115suc@gmail.com
    version: ${application.version}
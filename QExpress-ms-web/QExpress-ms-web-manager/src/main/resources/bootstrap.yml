application:
  version: v1.0
logging:
  config: classpath:logback-spring.xml
spring:
  application:
    name: QExpress-ms-web-manager
  main:
    allow-circular-references: true #允许bean循环依赖
  profiles:
    active: test
  mvc:
    pathmatch:
      #解决异常：swagger Failed to start bean 'documentationPluginsBootstrapper'; nested exception is java.lang.NullPointerException
      #因为Springfox使用的路径匹配是基于AntPathMatcher的，而Spring Boot 2.6.X使用的是PathPatternMatcher
      matching-strategy: ant_path_matcher
qe:
  swagger:
    package-path: course.QExpress.web.manager.controller
    title: 青品速递 - 管理后台微服务接口文档
    description: 该服务用于管理后台
    contact-name: QExpress-web-manager-service
    contact-url: http://www.1115suc.com/
    contact-email: 1115suc@gmail.com
    version: ${application.version}
feign:
  httpclient:
    max-connections: 2000
server:
  tomcat:
    accept-count: 10000
    threads:
      max: 5000
    max-connections: 5000
